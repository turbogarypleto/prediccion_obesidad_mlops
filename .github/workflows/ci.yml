name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen Docker
        run: docker build -t obesity-api:${{ github.sha }} .
      - name: Guardar imagen como artefacto
        run: docker save obesity-api:${{ github.sha }} -o obesity-api.tar
      - uses: actions/upload-artifact@v4
        with:
          name: obesity-api-image
          path: obesity-api.tar

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: obesity-api-image
      - name: Cargar imagen
        run: docker load -i obesity-api.tar
      - name: Levantar contenedor
        run: docker run -d -p 8000:8000 --name obesity-api obesity-api:${{ github.sha }}
      - name: Esperar arranque
        run: sleep 8
      - name: Probar /health
        run: curl --fail http://localhost:8000/health
      - name: Probar /predict
        run: |
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Gender":"Male","Age":25,"Height":1.75,"Weight":82,"family_history":"yes","FAVC":"yes","FCVC":2,"NCP":3,"CAEC":"Sometimes","SMOKE":"no","CH2O":2,"SCC":"no","FAF":1,"TUE":1,"CALC":"Sometimes","MTRANS":"Public_Transportation"}'
      - name: Logs del contenedor (si algo falla)
        if: failure()
        run: docker logs obesity-api
